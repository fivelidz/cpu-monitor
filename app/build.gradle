plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fivelidz.cpumonitor'
    compileSdk 34

    defaultConfig {
        applicationId "com.fivelidz.cpumonitor"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}